<script>
'use strict';
/* ===================== core utilities ===================== */
const W = 384, H = 216;
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function mulberry32(a) {

const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function linePts(x0, y0, x1, y1) {

/* ===================== layout ===================== */
const GX0 = 90, GY0 = 12, GX1 = 370, GY1 = 146;   // window glass

const SUNRISE = 6.25, SUNSET = 19.15, MOONRISE = 19.9, MOONDUR = 10.4;

PKEYS.push([24, PKEYS[0][1]]);
const PFIELDS = Object.keys(PKEYS[0][1]);

function samplePalette(h) {
  h = ((h % 24) + 24) % 24;
  let i = 0;
  while (i < PKEYS.length - 2 && PKEYS[i + 1][0] <= h) i++;
  const [h0, a] = PKEYS[i], [h1, b] = PKEYS[i + 1];
  const t = smooth(0, 1, (h - h0) / (h1 - h0));
  const P = {};
  for (const k of PFIELDS) P[k] = mixc(a[k], b[k], t);
  return P;
}
function greyed(c, k, dark) {
  const l = lum(c) * dark;
  return mixc(c, [l * 0.9 + 10, l * 0.95 + 13, l * 1.02 + 20], k);
}

/* sky state for an hour + weather */
function computeSky(h, wx) {
  const P = samplePalette(h);
  // --- sun
  const u = (h - SUNRISE) / (SUNSET - SUNRISE);
  P.sunU = u;
  P.sunX = lerp(172, 318, u);
  P.sunY = HOR - Math.sin(Math.PI * clamp(u, -0.2, 1.2)) * 60;
  P.sunAlt = clamp(Math.sin(Math.PI * clamp(u, 0, 1)));
  P.sunUp = u > -0.04 && u < 1.04;
  P.sunR = lerp(7, 5, smooth(0.0, 0.3, P.sunAlt));
  P.sunCore = mixc(hex('#ffe089'), hex('#fffbea'), smooth(0.04, 0.4, P.sunAlt));
  P.sunEdge = mixc(hex('#ff7448'), hex('#ffe7a3'), smooth(0.04, 0.45, P.sunAlt));
  // glow near the sun, strongest when low; twilight glow persists just below the horizon
  const near = smooth(-0.1, -0.005, u) * (1 - smooth(1.005, 1.1, u));
  P.glowAmt = near * lerp(0.95, 0.35, smooth(0.0, 0.5, P.sunAlt));
  P.glowR = lerp(64, 30, smooth(0, 0.5, P.sunAlt));
  P.horGlow = near * Math.pow(1 - P.sunAlt, 2.5) * 0.85;
  // --- moon
  const v = (((h - MOONRISE) % 24) + 24) % 24 / MOONDUR;
  P.moonU = v;
  P.moonUp = v < 1.03 || v > (24 / MOONDUR) - 0.03;
  const vv = v > 1.5 ? v - 24 / MOONDUR : v;
  P.moonX = lerp(186, 330, vv);
  P.moonY = HOR - Math.sin(Math.PI * clamp(vv, -0.2, 1.2)) * 50;
  // --- day/night factors
  const dayl = smooth(5.2, 7.0, h) * (1 - smooth(18.7, 20.3, h));
  P.day = dayl;
  P.night = 1 - dayl;
  P.stars = h > 12 ? smooth(19.7, 21.0, h) : 1 - smooth(4.9, 6.0, h);
  P.lights = h > 12 ? smooth(18.9, 20.1, h) : 1 - smooth(6.4, 7.8, h);
  // --- weather
  const oc = clamp(clamp((wx.cover - 0.55) / 0.45) * 0.5 + wx.rain * 0.55 + wx.storm * 0.15);
  P.overcast = oc;
  const dk = 1 - 0.18 * oc - 0.12 * wx.storm;
  for (const k of ['top', 'mid', 'hor', 'glow', 'seaF', 'seaN', 'land']) P[k] = greyed(P[k], oc * 0.85, dk);
  for (const k of ['cHi', 'cMd', 'cLo', 'cSh']) P[k] = greyed(P[k], oc * 0.9, 1 - 0.3 * oc);
  P.out = greyed(P.out, oc * 0.6, 1 - 0.25 * oc);
  P.amb = greyed(P.amb, oc * 0.45, 1 - 0.2 * oc * P.day - 0.1 * wx.storm);
  P.sunVis = 1 - clamp(oc * 1.1);
  P.glowAmt *= 1 - oc * 0.85;
  P.horGlow *= 1 - oc * 0.9;
  P.stars *= 1 - clamp(oc * 1.4);
  P.lights = clamp(P.lights + oc * 0.35 * P.day);
  P.cover = wx.cover;
  P.rain = wx.rain;
  P.storm = wx.storm;
  return P;
}

function genCumulus(rng, w, h) {
  const m = new Uint8Array(w * h);
  const base = h - 1;
  const n = 3 + ((rng() * 4) | 0);
  const cs = [];
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n;
    const bell = Math.sin(Math.PI * u);
    const r = Math.max(2.2, h * (0.28 + 0.5 * bell) * (0.82 + rng() * 0.3));
    cs.push([3 + u * (w - 6) + (rng() - 0.5) * 3, base - r * (0.45 + rng() * 0.25) + 1, r]);
  }
  const extra = 1 + ((rng() * 2) | 0);
  for (let i = 0; i < extra; i++) {
    const u = 0.28 + rng() * 0.44, r = h * (0.32 + rng() * 0.18);
    cs.push([3 + u * (w - 6), base - h * 0.5 - rng() * h * 0.12, r]);
  }
  const L = [-0.42, -0.8, 0.43];
  for (let y = 0; y <= base; y++) for (let x = 0; x < w; x++) {
    let bz = -1, bn = null;
    for (const c of cs) {
      const dx = x + 0.5 - c[0], dy = y + 0.5 - c[1];
      const d2 = dx * dx + dy * dy, r2 = c[2] * c[2];
      if (d2 < r2) {
        const z = Math.sqrt(r2 - d2);
        if (z > bz) { bz = z; bn = [dx / c[2], dy / c[2], z / c[2]]; }
      }
    }
    if (!bn) continue;
    let lam = bn[0] * L[0] + bn[1] * L[1] + bn[2] * L[2] + (bayer(x, y) - 0.5) * 0.2;
    let lv = lam > 0.64 ? 4 : lam > 0.34 ? 3 : lam > 0.06 ? 2 : 1;
    if (y === base) lv = 1; else if (y === base - 1) lv = Math.min(lv, 2);
    m[y * w + x] = lv;
  }
  return { w, h, m };
}
function genStratus(rng, w, h) {
  const m = new Uint8Array(w * h);
  const ph = rng() * 6;
  for (let x = 0; x < w; x++) {
    const u = x / (w - 1);
    const env = Math.pow(Math.sin(Math.PI * u), 0.55);
    const th = Math.max(0, Math.round(env * h + Math.sin(x * 0.21 + ph) * 0.7));
    const top = Math.round((h - th) / 2 + Math.sin(x * 0.07 + ph) * 0.6);
    for (let y = 0; y < th; y++) {
      const yy = top + y;
      if (yy >= 0 && yy < h) m[yy * w + x] = y === 0 ? 3 : y === th - 1 ? 1 : 2;
    }
  }
  return { w, h, m };
}

const BOLT = { pts: null, life: 0, x: 0 };

  window.addEventListener('pointermove', wake); window.addEventListener('pointerdown', wake); window.addEventListener('keydown', wake);
  window.addEventListener('resize', resize);
  document.addEventListener('fullscreenchange', () => { resize(); syncUI(); });
  document.addEventListener('webkitfullscreenchange', () => { resize(); syncUI(); });
  syncUI();
}
function syncUI() {
  $$('[data-vol]').forEach(inp => { inp.value = S.vol[inp.dataset.vol]; setFill(inp); });
  const time = $('#time'); time.value = S.hour; setFill(time);
  $('#rainAmt').value = S.rainAmt; setFill($('#rainAmt'));
  $('#pigeons').checked = S.pigeons;
  $('#speed').value = String(S.dayLen);
  const cyc = $('#btnCycle');
  const running = S.cycle || S.dayLen === 0;
  cyc.setAttribute('aria-pressed', String(running));
  cyc.lastChild.textContent = running ? ' El temps passa' : ' Temps aturat';
  setIcon(cyc, running ? 'pause' : 'play');
  $$('#weather button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === S.weatherMode)));
  $$('#fit button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fit === S.fit)));
  const fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $('#btnFull').lastChild.textContent = fs ? ' Surt de pantalla completa' : ' Pantalla completa';
  syncMusicBtn();
}
let uiAcc = 0;
function uiTick(dt) {
  uiAcc += dt;
  idleT += dt;
  if (idleT > 3.5 && !panelOpen) document.body.classList.add('idle');
  if (uiAcc < 0.2) return;
  uiAcc = 0;
  $('#clock').textContent = fmtHour(S.hour);
  if (panelOpen && !dragging) { const t = $('#time'); t.value = S.hour; setFill(t); }
  const wlabel = $('#wxNow');
  if (wlabel) {
    const r = S.wx.rain, st = S.wx.storm;
    wlabel.textContent = st > 0.5 ? 'Tempesta' : r > 0.25 ? 'Plou' : S.wx.cover > 0.65 ? 'Ennuvolat' : 'Cel clar';
  }
}

/* ===================== boot ===================== */
function boot() {
  buildSprites();
  SPR.legs = spriteFromMap(LEGS2, LEGS_PAL);
  buildRoomStatic();
  buildLighting();
  codeInit();
  if (!DEBUG) load();
  const QS = new URLSearchParams(location.search);
  if (QS.has('h')) S.hour = parseFloat(QS.get('h'));
  if (QS.has('w')) { S.weatherMode = QS.get('w'); Object.assign(S.wx, wxTargets(S.weatherMode)); }
  else if (S.weatherMode !== 'auto') Object.assign(S.wx, wxTargets(S.weatherMode));
  if (DEBUG) { FROZEN = true; document.body.classList.add('debug'); }
  buildUI();
  resize();
  requestAnimationFrame(frame);
  window.__lofi = {
    S, GIRL, LP,
    set(o) {
      if (o.hour !== undefined) { S.hour = o.hour; S.timeAnim = null; }
      if (o.wx) { S.weatherMode = o.wx; Object.assign(S.wx, wxTargets(o.wx)); for (const c of CLOUDS) c.vis = undefined; }
      if (o.freeze !== undefined) FROZEN = o.freeze;
      if (o.girl) girlDo(o.girl);
      if (o.pigeon) { LP.timer = 0; LP.st = 'away'; }
      if (o.flock) spawnFlock(o.flock === 'near');
      if (o.strike) strike();
    },
  };
}
boot();

</script>
